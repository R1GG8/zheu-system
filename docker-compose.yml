services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: zheu_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Брокер сообщений Redis
  redis:
    image: redis:7-alpine
    container_name: zheu_redis
    ports:
      - "6379:6379"

  # 3. Веб-сервер Django (Backend)
  web:
    build: .
    container_name: zheu_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # 4. Фоновый воркер Celery (выполняет отправку пушей)
  worker:
    build: .
    container_name: zheu_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # 5. Клиентский интерфейс Vue.js (Frontend)
  frontend:
    image: node:20-alpine
    container_name: zheu_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - web

volumes:
  postgres_data: